# Copy outside Git to .streamlit/secrets.toml on the deployment host.
[auth]
redirect_uri = "https://YOUR-STAGING-HOST/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"

[auth.google]
client_id = "REPLACE_WITH_NEW_DEMO_CLIENT_ID"
client_secret = "REPLACE_WITH_NEW_DEMO_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[deployment]
# Configure invited addresses privately on the server.
allowed_emails = []
