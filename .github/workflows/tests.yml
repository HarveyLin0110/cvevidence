name: Fresh integration tests
on:
  pull_request:
  push:
    branches: [main, 'codex/frankie-fresh-milestones', 'codex/horace-development']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install evidence inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils squashfs-tools bubblewrap
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: PYTHONPATH=src python scripts/export_contracts.py
      - run: git diff --exit-code contracts/schemas
  firmware-reader:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      CVEVIDENCE_REQUIRE_FIRMWARE_READER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools bubblewrap
      - name: Require isolated execution environment
        run: >-
          bwrap --unshare-all --die-with-parent --new-session --cap-drop ALL
          --ro-bind /usr/lib /usr/lib --ro-bind /lib /lib --ro-bind-try /lib64 /lib64
          --proc /proc --dev /dev --tmpfs /tmp
          --ro-bind /usr/bin/true /reader --chdir /tmp /reader
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_firmware_inventory.py tests/test_firmware_binaries.py
  engineering-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y binutils squashfs-tools bubblewrap
      - run: python -m pip install -r requirements.txt
      - name: Verify static evidence, runtime supplements and tamper rejection
        run: python scripts/validate_engineering.py
